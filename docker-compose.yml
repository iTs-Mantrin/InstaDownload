version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - SECRET_KEY=change-me-in-production
      - DOWNLOAD_DIR=/tmp/instadownload
      - MAX_FILE_AGE_MINUTES=30
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/instadownload
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - downloads:/tmp/instadownload
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instadownload
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
  downloads:
